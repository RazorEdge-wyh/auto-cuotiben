name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Show version
        run: node --version
      - name: Run tests
        run: node --test
      - name: Smoke test CLI
        run: |
          node bin/cuotiben.js version
          node bin/cuotiben.js doctor
          node bin/cuotiben.js demo --out /tmp/demo/index.html
          test -s /tmp/demo/index.html
